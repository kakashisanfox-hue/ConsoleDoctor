
name: Console Doctor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceitar licencas Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Instalar Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar XML do AndroidManifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          data = path.read_bytes()

          print("Tamanho:", len(data), "bytes")
          print("Primeiros bytes:", repr(data[:100]))

          try:
              ET.fromstring(data)
              print("XML válido!")
          except ET.ParseError as error:
              print("ERRO NO XML:", error)
              raise
          PY

      - name: Gerar APK com diagnostico detalhado
        run: |
          gradle assembleDebug --no-daemon --stacktrace --info

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleDoctor-APK
          path: app/build/outputs/apk/debug/*.apk
